  <!-- Brikken som skal plasseres. Den eneste tingen som svever her. -->
  <div class="seksjon seksjon--luft midt">
    <div class="kort kort--tett" style="border-radius:20px">
      <p class="tittel" style="font-family:'Space Grotesk',sans-serif; font-weight:500; font-size:19px; letter-spacing:-.02em; text-align:center; margin:0">3-veis håndtrykk</p>

  </div>

    <button type="button" class="felle">

        hvilken side et trekk hører til.
      </p>

    <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px">
