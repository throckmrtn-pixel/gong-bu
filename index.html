<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#51688A">
<title>gong-bu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600&family=JetBrains+Mono:wght@400;500;700&display=swap">
<link rel="stylesheet" href="flyt.css">
</head>
<body>

<!-- ============================================================
     VELGEREN
     Inngangen til appen. Én avgjørelse: hvilket fag.

     Nedtrekket står rett under gong-bu-linja, der navnet på stedet
     du er står fra før — det er den naturlige plassen for navnet på
     det du er i ferd med å gå inn i. Resten av flaten er bildet.
     ============================================================ -->

<div class="skjerm" data-tema-auto data-tema="staal" data-bak="ror" data-fag="in1020" id="skjerm">

  <div class="scene"></div>

  <div class="statuslinje" aria-hidden="true">
    <span>9:41</span>
    <span class="ikoner">
      <svg width="17" height="11" viewBox="0 0 17 11" fill="currentColor"><rect x="0" y="7.5" width="3" height="3.5" rx="1"/><rect x="4.6" y="5" width="3" height="6" rx="1"/><rect x="9.2" y="2.5" width="3" height="8.5" rx="1"/><rect x="13.8" y="0" width="3" height="11" rx="1"/></svg>
      <svg width="16" height="12" viewBox="0 0 16 12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M1 4.2a10 10 0 0 1 14 0"/><path d="M3.6 7a6.4 6.4 0 0 1 8.8 0"/><path d="M6.3 9.7a2.6 2.6 0 0 1 3.4 0"/></svg>
      <svg width="25" height="12" viewBox="0 0 25 12" fill="none"><rect x="0.6" y="0.6" width="21" height="10.8" rx="3" stroke="currentColor" stroke-opacity=".5" stroke-width="1.1"/><rect x="2.2" y="2.2" width="17" height="7.6" rx="1.8" fill="currentColor"/><path d="M23.2 4.2v3.6a2 2 0 0 0 0-3.6z" fill="currentColor" fill-opacity=".5"/></svg>
    </span>
  </div>

  <div class="toppbar">
    <div class="merke">
      <span class="glyf" aria-hidden="true">공부</span>
      <div style="min-width:0">
        <div class="navn">gong-bu</div>
        <div class="etikett" style="font-size:7.5px; letter-spacing:.2em">Studieplass</div>
      </div>
    </div>

    <span class="delestrek" aria-hidden="true"></span>

    <div class="vault">
      <div class="navn" style="font-weight:400">Obsidian</div>
      <div class="rad" style="gap:6px">
        <span class="prikk" aria-hidden="true"></span>
        <span class="etikett" style="font-size:7.5px; letter-spacing:.18em">Synk 2m</span>
      </div>
    </div>

    <button type="button" class="mer" aria-label="Flere valg">&#8943;</button>
  </div>

  <div class="landing">

    <!-- ============================================================
         NEDTREKKET — rett under merket.
         Lista bygges av flyt-fag.js fra fagregisteret.
         ============================================================ -->
    <div class="seksjon" style="padding-top:12px">
      <div class="nedtrekk" data-apen="false">
        <button type="button" class="nedtrekk-knapp"
                aria-expanded="false" aria-controls="fagliste" aria-haspopup="listbox">
          <span class="merket" aria-hidden="true" data-fag-merke>IN</span>
          <span class="tekst">
            <span class="kode" data-fag-kode>IN1020</span>
            <span class="navn" data-fag-navn>Datateknologi</span>
          </span>
          <svg class="pil" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
        </button>
        <ul class="nedtrekk-liste" id="fagliste" role="listbox" aria-label="Velg fag"></ul>
      </div>
    </div>

    <!-- Lufta. Her er det bildet som jobber. -->
    <div class="fyller"></div>

    <div class="seksjon">
      <h1 style="font-size:35px"><span id="hilsen">God kveld</span>,<br>Ami</h1>
    </div>

    <!-- To tall for faget du har valgt. -->
    <div class="seksjon seksjon--tett">
      <div class="tallpar">
        <div><b data-fag-andel>62<small>&#8202;%</small></b><span>Beredskap</span></div>
        <div><b data-fag-venter>12 forfalt</b><span>Venter</span></div>
      </div>
    </div>

    <div class="sokkel">
      <a class="pille pille--stor pille--lys" data-fag-videre="hjem.html?fag={fag}" href="hjem.html"><span>Fortsett</span></a>
      <button type="button" class="pille pille--stille" style="align-self:center"><span>Legg til fag fra vaulten</span></button>
    </div>

  </div>

  <div class="hjemstrek" aria-hidden="true"><i></i></div>

</div>

<script src="flyt-utseende.js"></script>
<script src="flyt-tid.js"></script>
<script src="flyt-scene.js"></script>
<script src="flyt-fag.js"></script>
<script src="flyt-ui.js"></script>
<script>
/* Hilsenen følger klokka, på samme måte som temaet gjør. */
(function () {
  var t = new Date().getHours();
  document.getElementById('hilsen').textContent =
    t < 5 ? 'God natt' : t < 10 ? 'God morgen' : t < 18 ? 'God dag' : 'God kveld';
})();
window.addEventListener('message', function (e) {
  if (e.data && e.data.tema) {
    var s = document.getElementById('skjerm');
    s.dataset.temaLaast = ''; s.dataset.tema = e.data.tema;
  }
});
</script>

</body>
</html>
