<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 12" shape-rendering="crispEdges" role="img" aria-label="Pikselku">
  <title>Pikselku</title>
  <!-- hale -->
  <rect x="14" y="1" width="1" height="1" fill="#C7CBDC"/>
  <rect x="14" y="2" width="1" height="4" fill="#FFFFFF"/>
  <!-- kropp og hode -->
  <rect x="4" y="3" width="11" height="5" fill="#FFFFFF"/>
  <rect x="1" y="4" width="4" height="4" fill="#FFFFFF"/>
  <rect x="2" y="3" width="1" height="1" fill="#FFFFFF"/>
  <!-- øret fanger sola -->
  <rect x="1" y="3" width="1" height="1" fill="#FFE2AA"/>
  <!-- pastellflekker -->
  <rect x="6" y="3" width="3" height="2" fill="#D5D9F2"/>
  <rect x="11" y="5" width="3" height="2" fill="#D6F0EA"/>
  <!-- mule -->
  <rect x="1" y="6" width="2" height="2" fill="#F8DCE6"/>
  <!-- øye -->
  <rect x="3" y="5" width="1" height="1" fill="#191D2B"/>
  <!-- bein -->
  <rect x="5" y="8" width="2" height="3" fill="#FFFFFF"/>
  <rect x="9" y="8" width="2" height="3" fill="#FFFFFF"/>
  <rect x="12" y="8" width="2" height="3" fill="#F4F6FC"/>
  <!-- klover -->
  <rect x="5" y="10" width="2" height="1" fill="#C7D6F7"/>
  <rect x="9" y="10" width="2" height="1" fill="#C7D6F7"/>
  <rect x="12" y="10" width="2" height="1" fill="#C7D6F7"/>
</svg>
