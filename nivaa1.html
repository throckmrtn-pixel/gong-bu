    <span class="nivaa">Nivå 01 · Gjenkjenning</span>

    <div class="kort kort--tett">
      <p class="etikett">Hvilket begrep?</p>

        både til å kryptere og dekryptere.
      </p>
    </div>
  </div>

  <div class="fyll"></div>

  <!-- Ingen av svarene gløder. Fire like glorier blir et fargebelte. -->
  <div class="seksjon stabel" style="gap:10px">
    <button type="button" class="pille svar"><span class="nr">01</span><span>Symmetrisk kryptering</span></button>
    <button type="button" class="pille svar"><span class="nr">02</span><span>Asymmetrisk kryptering</span></button>
    <button type="button" class="pille svar"><span class="nr">03</span><span>Hashfunksjon</span></button>

  <div class="sokkel sokkel--lav">
