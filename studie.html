<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#51688A">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon.ico" sizes="16x16 32x32 48x48">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="gong-bu">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Studieøkt · gong-bu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600&family=JetBrains+Mono:wght@400;500;700&display=swap">
<link rel="stylesheet" href="flyt.css">
</head>
<body>

<div class="skjerm" data-tema-auto data-tema="staal" id="skjerm">

  <!-- Scenen bygges av flyt-scene.js. -->
  <div class="scene"></div>

  <!-- Telefonens egen statuslinje. Hører til enheten, ikke til appen. -->
  <div class="statuslinje" aria-hidden="true">
    <span>9:41</span>
    <span class="ikoner">
      <svg width="17" height="11" viewBox="0 0 17 11" fill="currentColor"><rect x="0" y="7.5" width="3" height="3.5" rx="1"/><rect x="4.6" y="5" width="3" height="6" rx="1"/><rect x="9.2" y="2.5" width="3" height="8.5" rx="1"/><rect x="13.8" y="0" width="3" height="11" rx="1"/></svg>
      <svg width="16" height="12" viewBox="0 0 16 12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M1 4.2a10 10 0 0 1 14 0"/><path d="M3.6 7a6.4 6.4 0 0 1 8.8 0"/><path d="M6.3 9.7a2.6 2.6 0 0 1 3.4 0"/></svg>
      <svg width="25" height="12" viewBox="0 0 25 12" fill="none"><rect x="0.6" y="0.6" width="21" height="10.8" rx="3" stroke="currentColor" stroke-opacity=".5" stroke-width="1.1"/><rect x="2.2" y="2.2" width="17" height="7.6" rx="1.8" fill="currentColor"/><path d="M23.2 4.2v3.6a2 2 0 0 0 0-3.6z" fill="currentColor" fill-opacity=".5"/></svg>
    </span>
  </div>

  <!-- ============================================================
       TOPP
       ============================================================ -->
  <header class="topp">
    <a class="rund" href="hjem.html" aria-label="Tilbake">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>
    </a>
    <span class="etikett etikett--sterk">Studieøkt</span>
    <button type="button" class="rund" id="lyd" aria-label="Slå alarmlyden av eller på" aria-pressed="true">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5L6 9H3v6h3l5 4V5z"/><path d="M16 9a4 4 0 0 1 0 6" class="lydbue"/></svg>
    </button>
  </header>

  <div class="seksjon seksjon--tett" style="text-align:center">
    <p class="etikett">Emne</p>
    <h1 id="fag" style="font-size:28px">Datasikkerhet</h1>
    <p class="hjelp"  id="undertittel">Velg hvor lenge. Du kan stoppe når som helst.</p>
  </div>

  <!-- ============================================================
       URSKIVA — ringen er klokka, orben er selskapet
       ============================================================ -->
  <div class="fyll midt" style="flex-direction:column; gap:18px">

    <!-- Urskiva er et måleinstrument, ikke en fremdriftsring. Derfor
         er buen blekk og ikke lys, og derfor har skiva to ringer med
         merkestrek: en fin utenfor og fire kvartmerker innenfor. -->
    <div class="urskive">
      <svg viewBox="0 0 300 300" aria-hidden="true">
        <!-- sporet. Ingen merkering rundt: hundre og tjue små
             streker langs kanten er hundre og tjue striper. -->
        <circle cx="150" cy="150" r="134" fill="none" stroke="var(--kant-linje)" stroke-width="3.5"/>
        <!-- nedtellingen -->
        <circle id="bane" cx="150" cy="150" r="134" fill="none" stroke="var(--urviser)" stroke-width="3.5"
                stroke-linecap="round" stroke-dasharray="842" stroke-dashoffset="0"
                transform="rotate(-90 150 150)" opacity=".8"
                style="transition:stroke-dashoffset .6s linear"/>
        <!-- merket i enden av buen: en ring, ikke en lyskule -->
        <g id="hode" transform="rotate(0 150 150)">
          <circle cx="150" cy="16" r="4" fill="var(--urviser)" opacity=".8"/>
        </g>
      </svg>

      <!-- ====== ORBEN ====== -->
      <div class="orb" id="orb" data-sinn="rolig" role="img" aria-label="Studiekompisen">

      </div>
    </div>

    <div class="tid-rad">
      <p class="tid" id="klokke">25:00</p>
      <p class="etikett" id="status">Klar når du er</p>
    </div>

    <!-- varighetsvalgene -->
    <div class="valg" id="valg" role="group" aria-label="Lengde på økten">
      <button type="button" data-min="15" aria-pressed="false">15 min</button>
      <button type="button" data-min="25" aria-pressed="true">25 min</button>
      <button type="button" data-min="45" aria-pressed="false">45 min</button>
      <button type="button" data-min="60" aria-pressed="false">60 min</button>
    </div>
  </div>

  <!-- ============================================================
       KORTET — hva som venter etterpå. Ingen streak, ingen press.
       ============================================================ -->
  <div class="seksjon">
    <div class="kort kort--strek" style="display:flex; align-items:center; gap:13px">
      <img class="kua-liten" src="ku.svg" width="38" height="29" alt="">
      <p class="brod" style="font-size:13.5px" id="etterpaa">12 kort venter når du er ferdig. De går ingen steder.</p>
    </div>
  </div>

  <!-- ============================================================
       KONTROLLENE
       ============================================================ -->
  <div class="sokkel" id="sokkel">
    <button type="button" class="pille pille--stor pille--lys" id="primaer"><span>Start økten</span></button>
    <div class="rad" style="justify-content:center; gap:16px">
      <button type="button" class="pille" id="sekundaer" hidden style="min-height:44px; font-size:14px"><span>Avslutt</span></button>
      <button type="button" class="pille" id="pluss" hidden style="min-height:44px; font-size:14px"><span>+ 5 min</span></button>
    </div>
  </div>

  <p id="melding" aria-live="polite" style="position:absolute; width:1px; height:1px; overflow:hidden; clip-path:inset(50%)"></p>


  <div class="hjemstrek" aria-hidden="true"><i></i></div>

</div>

<script src="flyt-utseende.js"></script>
<script src="flyt-tid.js"></script>
<script src="flyt-scene.js"></script>
<script src="flyt-orb.js"></script>
<script src="flyt-fag.js"></script>
<script src="flyt-ui.js"></script>
<script>
(function () {
  "use strict";

  var OMKRETS = 2 * Math.PI * 134;          // sporet i urskiva
  var skjerm  = document.getElementById('skjerm');
  var orb     = document.getElementById('orb');
  var bane    = document.getElementById('bane');
  var hode    = document.getElementById('hode');
  var klokke  = document.getElementById('klokke');
  var status  = document.getElementById('status');
  var valg    = document.getElementById('valg');
  var primaer = document.getElementById('primaer');
  var sekundaer = document.getElementById('sekundaer');
  var pluss   = document.getElementById('pluss');
  var undertittel = document.getElementById('undertittel');
  var etterpaa = document.getElementById('etterpaa');
  var melding = document.getElementById('melding');
  var lydknapp = document.getElementById('lyd');

  var varighet = 25 * 60;   // sekunder
  var igjen    = varighet;
  var tilstand = 'klar';    // klar | gaar | pause | ferdig
  var slutt    = 0;         // tidspunkt økten er ferdig (ms)
  var ticker   = null;
  var lydPaa   = true;

  /* ---------- tegning ---------- */

  function tostiln(n) { return (n < 10 ? '0' : '') + n; }

  function tegn() {
    var s = Math.max(0, Math.round(igjen));
    klokke.textContent = tostiln(Math.floor(s / 60)) + ':' + tostiln(s % 60);

    var gaatt = varighet > 0 ? (varighet - s) / varighet : 0;
    bane.style.strokeDashoffset = (OMKRETS * gaatt).toFixed(1);
    hode.setAttribute('transform', 'rotate(' + (gaatt * 360).toFixed(2) + ' 150 150)');
  }

  function settTilstand(ny) {
    tilstand = ny;
    orb.dataset.sinn = ({ klar: 'rolig', gaar: 'jobber', pause: 'hviler', ferdig: 'ferdig' })[ny];

    valg.hidden       = ny !== 'klar';
    sekundaer.hidden  = ny === 'klar';
    pluss.hidden      = ny === 'klar';

    if (ny === 'klar') {
      primaer.querySelector('span').textContent = 'Start økten';
      status.textContent = 'Klar når du er';
      undertittel.textContent = 'Velg hvor lenge. Du kan stoppe når som helst.';
      primaer.classList.add('pille--lys');
    } else if (ny === 'gaar') {
      primaer.querySelector('span').textContent = 'Pause';
      status.textContent = 'Igjen av ' + (varighet / 60) + ' minutter';
      undertittel.textContent = 'Den sitter her så lenge du jobber.';
      primaer.classList.remove('pille--lys');
      melding.textContent = 'Økten er i gang.';
    } else if (ny === 'pause') {
      primaer.querySelector('span').textContent = 'Fortsett';
      status.textContent = 'På pause';
      undertittel.textContent = 'Ingen hast. Trykk fortsett når du er tilbake.';
      primaer.classList.add('pille--lys');
      melding.textContent = 'Økten er satt på pause.';
    } else {
      primaer.querySelector('span').textContent = 'Til kortene';
      status.textContent = 'Ferdig';
      undertittel.textContent = 'Det holder for nå. Strekk på beina.';
      sekundaer.querySelector('span').textContent = 'Ny økt';
      etterpaa.textContent = '12 kort venter. Ta dem nå, eller la dem ligge.';
      primaer.classList.add('pille--lys');
      melding.textContent = 'Økten er ferdig.';
    }
  }

  /* ---------- tidtaking ----------
     Regnes ut fra klokkeslett, ikke ved å telle ned en variabel,
     slik at den ikke sakker etter når fanen har vært i bakgrunnen. */

  function tikk() {
    igjen = (slutt - Date.now()) / 1000;
    if (igjen <= 0) {
      igjen = 0;
      stopp();
      settTilstand('ferdig');
      alarm();
    }
    tegn();
  }

  function start() {
    slutt = Date.now() + igjen * 1000;
    ticker = setInterval(tikk, 250);
    settTilstand('gaar');
  }

  function stopp() { clearInterval(ticker); ticker = null; }

  function nullstill() {
    stopp();
    igjen = varighet;
    sekundaer.querySelector('span').textContent = 'Avslutt';
    etterpaa.textContent = '12 kort venter når du er ferdig. De går ingen steder.';
    settTilstand('klar');
    tegn();
  }

  /* ---------- alarmen ----------
     Tre toner i en myk treklang. Web Audio krever at brukeren har
     trykket på noe først — og det har hun, for økten ble startet. */

  function alarm() {
    if (navigator.vibrate) { try { navigator.vibrate([90, 80, 90, 80, 160]); } catch (e) {} }
    if (!lydPaa) return;
    try {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      var ctx = new AC();
      [0, 0.26, 0.52].forEach(function (nar, i) {
        var frekvens = [660, 880, 1320][i];
        var osc = ctx.createOscillator();
        var gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.value = frekvens;
        var t = ctx.currentTime + nar;
        gain.gain.setValueAtTime(0, t);
        gain.gain.linearRampToValueAtTime(0.16, t + 0.03);
        gain.gain.exponentialRampToValueAtTime(0.0001, t + 1.5);
        osc.connect(gain).connect(ctx.destination);
        osc.start(t);
        osc.stop(t + 1.6);
      });
      setTimeout(function () { ctx.close(); }, 2600);
    } catch (e) { /* lyd er en bonus, aldri et krav */ }
  }

  /* ---------- hendelser ---------- */

  valg.addEventListener('click', function (e) {
    var b = e.target.closest('button');
    if (!b) return;
    Array.prototype.forEach.call(valg.children, function (o) {
      o.setAttribute('aria-pressed', String(o === b));
    });
    varighet = parseInt(b.dataset.min, 10) * 60;
    igjen = varighet;
    tegn();
  });

  primaer.addEventListener('click', function () {
    if (tilstand === 'klar' || tilstand === 'pause') { start(); }
    else if (tilstand === 'gaar') { stopp(); settTilstand('pause'); }
    else { window.location.href = 'nivaa1.html'; }
  });

  sekundaer.addEventListener('click', nullstill);

  pluss.addEventListener('click', function () {
    varighet += 300;
    igjen += 300;
    if (tilstand === 'gaar') { slutt += 300000; }
    if (tilstand === 'ferdig') { settTilstand('gaar'); start(); }
    tegn();
  });

  lydknapp.addEventListener('click', function () {
    lydPaa = !lydPaa;
    lydknapp.setAttribute('aria-pressed', String(lydPaa));
    lydknapp.querySelector('.lydbue').style.opacity = lydPaa ? '1' : '.25';
  });

  /* Prototypen bytter tema utenfra. */
  window.addEventListener('message', function (e) {
    if (e.data && e.data.tema) skjerm.dataset.tema = e.data.tema;
  });

  settTilstand('klar');
  tegn();
})();
</script>

</body>
</html>
