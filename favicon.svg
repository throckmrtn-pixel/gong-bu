<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img"
     aria-label="gong-bu" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!--
    Fanemerket. Fotoikonet er vakkert på hjemskjermen og grøt på 16 px,
    så her er motivet kokt ned til tre kronblad som må kunne leses som
    silhuett. Dyp bunn, lyse blad, synlige mellomrom — uten den
    kontrasten blir det en klump.
  -->
  <defs>
    <linearGradient id="bunn" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0" stop-color="#6E8CC4"/>
      <stop offset="1" stop-color="#3C5585"/>
    </linearGradient>
    <linearGradient id="blad" x1="30%" y1="0%" x2="70%" y2="100%">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#C8DCF6"/>
    </linearGradient>
    <linearGradient id="side" x1="30%" y1="0%" x2="70%" y2="100%">
      <stop offset="0" stop-color="#F0F6FF" stop-opacity=".92"/>
      <stop offset="1" stop-color="#A8C4E8" stop-opacity=".88"/>
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="14" fill="url(#bunn)"/>

  <!-- lyset oppe til høyre, retningen hele systemet er bygget rundt -->
  <circle cx="48" cy="15" r="16" fill="#FFFFFF" opacity=".17"/>

  <g>
    <!-- sidebladene først, så det fremste legger seg over -->
    <path d="M32 50C25 42 23 29 32 17C41 29 39 42 32 50Z"
          fill="url(#side)" transform="rotate(-46 32 50)"/>
    <path d="M32 50C25 42 23 29 32 17C41 29 39 42 32 50Z"
          fill="url(#side)" transform="rotate(46 32 50)"/>
    <path d="M32 52C24 43 22 28 32 13C42 28 40 43 32 52Z"
          fill="url(#blad)"/>
  </g>
</svg>
